<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1660" viewBox="0 0 1800 1660">
  <defs>
    <style>
      .algtitle{font:700 34px 'Times New Roman','Noto Serif CJK SC',serif;fill:#111}
      .text{font:400 28px 'Times New Roman','Noto Serif CJK SC',serif;fill:#111}
      .kw{font-weight:700}
      .num{font:400 25px 'Times New Roman',serif;fill:#666}
      .comment{font:italic 25px 'Times New Roman','Noto Serif CJK SC',serif;fill:#555}
      .rule{stroke:#111;stroke-width:3}
      .thin{stroke:#777;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1800" height="1660" fill="#FFFFFF"/>
  <line x1="90" y1="75" x2="1710" y2="75" class="rule"/>
  <text x="110" y="125" class="algtitle">Algorithm 1  MITL-to-Monitor Automatic Construction and Online Verdict</text>
  <line x1="90" y1="155" x2="1710" y2="155" class="thin"/>
  <text x="110" y="200" class="text"><tspan font-weight="700">Input:</tspan><tspan dx="12">MITL formula φ; timed prefix ρ; semantics mode; configuration cfg</tspan></text>
  <text x="110" y="242" class="text"><tspan font-weight="700">Output:</tspan><tspan dx="12">POSITIVE, NEGATIVE, INCONCLUSIVE, or explicit ERROR</tspan></text>
  <line x1="90" y1="270" x2="1710" y2="270" class="thin"/>

  <g>
    <text x="112" y="326" class="num">1:</text><text x="170" y="326" class="text"><tspan class="kw">procedure</tspan><tspan dx="12">TAMONITOR(φ, ρ, mode, cfg)</tspan></text>
    <text x="112" y="382" class="num">2:</text><text x="220" y="382" class="text"><tspan>φₙ ← NormalizeAndValidate(φ)</tspan></text>
    <text x="112" y="438" class="num">3:</text><text x="220" y="438" class="text"><tspan>A⁺ ← BuildTimedAutomaton(φₙ, cfg)</tspan></text>
    <text x="112" y="494" class="num">4:</text><text x="220" y="494" class="text"><tspan>A⁻ ← BuildTimedAutomaton(¬φₙ, cfg)</tspan></text>
    <text x="112" y="550" class="num">5:</text><text x="220" y="550" class="text"><tspan>π ← CheckAndFreezePropositionOrder(A⁺, A⁻)</tspan></text>
    <text x="112" y="606" class="num">6:</text><text x="220" y="606" class="text"><tspan>(A⁺, A⁻) ← ExactProjectBDDLabels(A⁺, A⁻, π, cfg.maxValuations)</tspan></text>
    <text x="112" y="662" class="num">7:</text><text x="220" y="662" class="text"><tspan>C⁺ ← AcceptingContinuationSpace(A⁺, mode)</tspan></text>
    <text x="112" y="718" class="num">8:</text><text x="220" y="718" class="text"><tspan>C⁻ ← AcceptingContinuationSpace(A⁻, mode)</tspan></text>
    <text x="112" y="774" class="num">9:</text><text x="220" y="774" class="text"><tspan>S⁺ ← InitialState(A⁺) ∩ C⁺;   S⁻ ← InitialState(A⁻) ∩ C⁻</tspan></text>
    <text x="100" y="830" class="num">10:</text><text x="220" y="830" class="text"><tspan>verdict ← Decide(S⁺, S⁻)</tspan></text>
    <text x="100" y="886" class="num">11:</text><text x="220" y="886" class="text"><tspan class="kw">for each</tspan><tspan dx="12">(Iᵢ, σᵢ) in ρ</tspan><tspan class="kw" dx="12">do</tspan></text>
    <text x="100" y="942" class="num">12:</text><text x="270" y="942" class="text"><tspan class="kw">if</tspan><tspan dx="12">verdict = INCONCLUSIVE</tspan><tspan class="kw" dx="12">then</tspan></text>
    <text x="100" y="998" class="num">13:</text><text x="320" y="998" class="text"><tspan>aᵢ ← Encode(σᵢ, π)</tspan></text>
    <text x="100" y="1054" class="num">14:</text><text x="320" y="1054" class="text"><tspan>S⁺ ← SymbolicPost(A⁺, S⁺, Iᵢ, aᵢ) ∩ C⁺</tspan></text>
    <text x="100" y="1110" class="num">15:</text><text x="320" y="1110" class="text"><tspan>S⁻ ← SymbolicPost(A⁻, S⁻, Iᵢ, aᵢ) ∩ C⁻</tspan></text>
    <text x="100" y="1166" class="num">16:</text><text x="320" y="1166" class="text"><tspan>verdict ← Decide(S⁺, S⁻)</tspan></text>
    <text x="100" y="1222" class="num">17:</text><text x="270" y="1222" class="text"><tspan>Record(Iᵢ, aᵢ, |S⁺|, |S⁻|, verdict)</tspan></text>
    <text x="100" y="1278" class="num">18:</text><text x="220" y="1278" class="text"><tspan class="kw">if</tspan><tspan dx="12">mode = FINITE and verdict = INCONCLUSIVE</tspan><tspan class="kw" dx="12">then</tspan></text>
    <text x="100" y="1334" class="num">19:</text><text x="270" y="1334" class="text"><tspan>verdict ← DecideFiniteEnd(S⁺, S⁻, A⁺, A⁻)</tspan></text>
    <text x="100" y="1390" class="num">20:</text><text x="220" y="1390" class="text"><tspan class="kw">return</tspan><tspan dx="12">verdict</tspan></text>
    <text x="100" y="1446" class="num">21:</text><text x="170" y="1446" class="text"><tspan class="kw">end procedure</tspan></text>
  </g>
  <line x1="90" y1="1480" x2="1710" y2="1480" class="thin"/>
  <text x="110" y="1524" class="comment">Invariant: S⁺ and S⁻ contain exactly the accepting continuations compatible with the observed prefix.</text>
  <text x="110" y="1566" class="comment">Fail-closed construction: unsupported syntax, proposition-order mismatch, or a resource-gate overflow yields ERROR.</text>
  <line x1="90" y1="1605" x2="1710" y2="1605" class="rule"/>
</svg>
