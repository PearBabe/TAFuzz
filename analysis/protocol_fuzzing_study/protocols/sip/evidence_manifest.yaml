          {
            "id": "KAMAILIO_TIMER_C_DEFAULT",
            "property": "SIP-TX-20",
            "finding": "fr_inv_timeout defaults to 120000 ms and max_inv_lifetime to exactly 180000 ms, while RFC 3261 requires Timer C strictly greater than 180000 ms.",
            "catalog_treatment": "NORMATIVE strict-bound oracle; fixed default profile is EXPECTED_VIOLATION unless configuration is pinned above the bound."
          },
          {
            "id": "DOUBANGO_TIMER_X_SECOND_INTERVAL",
            "property": "SIP-TX-22",
            "finding": "The initial handler shifts 500 to 1000 after scheduling; the first callback shifts again before scheduling, producing a 2000-ms next interval rather than 1000 ms.",
            "catalog_treatment": "NORMATIVE_EXPECTED_VIOLATION_PROFILE with an explicit source-realistic negative trace."
          },
          {
            "id": "DOUBANGO_TIMER_X_NO_T2_CAP",
            "property": "SIP-TX-23",
            "finding": "Timer X uses timeout <<= 1 without min(...,T2), permitting 8000-ms and longer intervals.",
            "catalog_treatment": "One fresh 4000-ms monitor per post-cap generation; 8000-ms source behavior is an explicit negative trace."
          },
          {
            "id": "DOUBANGO_TIMER_L_EARLY_TRANSPORT_TERMINATION",
            "property": "SIP-TX-25",
            "finding": "The FSM registers Any transport error -> Terminated although the RFC 6026 server-side retention property has no such early-discard exception.",
            "catalog_treatment": "All termination paths must emit the AP; the early transport path is an explicit known-deviation negative."
          }
        ],
        "deduplication": {
          "rejected_timed_properties": [
            "SIP-TX-02",
            "SIP-TX-08",
            "SIP-TX-14"
          ],
          "replacement_assertions": [
            "timer_a_callback -> invite_retransmit_requested",
            "timer_e_callback -> noninvite_retransmit_requested",
            "timer_g_callback -> final_response_retransmit_requested"
          ],
          "reason": "The RFC gives a causal callback action but no non-punctual callback/send latency bound measured from the earlier arm; the timing obligations duplicate TX-01/TX-07/TX-13."
