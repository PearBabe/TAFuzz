        "admission_summary": {
          "proposed": 1,
          "admitted": 1,
          "excluded": 10,
          "conclusion": "RFC 2326 explicitly permits a server-declared Session timeout, and locked LIVE555 uses one 65-second value for its default profile, Session response parameter, and per-session liveness task. One no-early callback profile property is therefore admitted with a caveat: RFC 2326 makes inactivity teardown optional, so no eventual callback deadline is claimed."
        },
        "deduplication": "RFC 2326 Section 12.37's 60-second default, Appendix A.2's one-minute state text, and LIVE555's declared 65-second override are one session-inactivity obligation, not three properties. RFC 7826's analogous RTSP/2.0 rule is retained only as a version-mismatch exclusion.",
