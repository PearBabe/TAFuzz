name: FC-ADG real ArduPilot experiment

on:
  push:
    branches:
      - experiment/iadg-lite-20260904
    paths:
      - 'experiments/iadg_lite/**'
      - '.github/workflows/iadg-lite.yml'
  workflow_dispatch:

concurrency:
  group: fc-adg-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ARDUPILOT_COMMIT: ff37fde6f13c02fb5ae32abdd07ff4f4e132cb76
      PGFUZZ_COMMIT: 7eaebf21116087249b8329d4ba7337a24a34ecb9
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct concise analyzer and 1475-input manifest
        shell: bash
        run: |
          set -euo pipefail
          base64 -d experiments/iadg_lite/fcadg_lite.py.gz.b64 | gzip -dc > experiments/iadg_lite/fcadg_lite.py
          cat experiments/iadg_lite/data/tiny.part-* > experiments/iadg_lite/data/input_manifest.csv.gz.b64
          python3 -m py_compile experiments/iadg_lite/fcadg_lite.py
          python3 - <<'PY'
          import base64, csv, gzip
          from pathlib import Path
          p=Path('experiments/iadg_lite/data/input_manifest.csv.gz.b64')
          rows=list(csv.DictReader(gzip.decompress(base64.b64decode(p.read_text())).decode().splitlines()))
          print('manifest_rows=',len(rows),'columns=',list(rows[0]))
          if len(rows)!=1475: raise SystemExit(f'expected 1475, got {len(rows)}')
          PY

      - name: Fetch frozen real ArduPilot source
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/ardupilot
          git -C /tmp/ardupilot remote add origin https://github.com/ArduPilot/ardupilot.git
          git -C /tmp/ardupilot sparse-checkout init --cone
          git -C /tmp/ardupilot sparse-checkout set ArduCopter libraries
          git -C /tmp/ardupilot fetch --depth=1 origin "$ARDUPILOT_COMMIT"
          git -C /tmp/ardupilot checkout --detach FETCH_HEAD
          test "$(git -C /tmp/ardupilot rev-parse HEAD)" = "$ARDUPILOT_COMMIT"

      - name: Fetch PGFuzz A.ALT_HOLD2 reference sets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pgfuzz-althold2
          base="https://raw.githubusercontent.com/purseclab/PGFuzz/${PGFUZZ_COMMIT}/ArduPilot/policies/A.ALT_HOLD2"
          for f in parameters.txt envs.txt cmds.txt; do curl -fL --retry 3 "$base/$f" -o "/tmp/pgfuzz-althold2/$f"; done

      - name: Build one source index and run hop-0 versus hop-2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/iadg_lite/out
          /usr/bin/time -v -o experiments/iadg_lite/out/time.txt \
            python3 experiments/iadg_lite/fcadg_lite.py \
              --source /tmp/ardupilot \
              --manifest experiments/iadg_lite/data/input_manifest.csv.gz.b64 \
              --pgfuzz-dir /tmp/pgfuzz-althold2 \
              --out experiments/iadg_lite/out \
              --include-root ArduCopter \
              --include-root libraries \
              --hops 0,2 \
              --progress \
            2>&1 | tee experiments/iadg_lite/out/console.log

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s experiments/iadg_lite/out/summary.json
          test -s experiments/iadg_lite/out/hop0/input_state_relations.csv
          test -s experiments/iadg_lite/out/hop2/input_state_relations.csv
          python3 - <<'PY'
          import json
          p='experiments/iadg_lite/out/summary.json'
          x=json.load(open(p))
          print(json.dumps(x,indent=2))
          assert x['inputs']==1475
          PY

      - name: Upload complete experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fc-adg-real-ardupilot-${{ github.run_id }}
          path: |
            experiments/iadg_lite/out
            experiments/iadg_lite/README.md
          retention-days: 30
